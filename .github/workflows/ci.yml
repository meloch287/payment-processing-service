name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests

  test:
    name: Unit, integration, e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payments"
          --health-interval 3s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://payments:payments@127.0.0.1:5432/payments
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
      API_KEY: ci-api-key
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest -v

  compose:
    name: Docker Compose e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Credentials with URL-reserved characters
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=p@ss:w/rd+=#1|; s|^RABBITMQ_PASSWORD=.*|RABBITMQ_PASSWORD=r@bbit:p/w+=#1|' .env
      - run: bash scripts/e2e-compose.sh

  quickstart:
    name: README quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/quickstart-check.sh

  local-dev:
    name: README local development
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://payments:payments@localhost:5432/payments
      RABBITMQ_URL: amqp://payments:payments@localhost:5672/
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres rabbitmq
      - run: uv sync
      - run: env -u DATABASE_URL -u RABBITMQ_URL uv run alembic upgrade head
      - name: api and consumer from README
        run: |
          env -u DATABASE_URL -u RABBITMQ_URL uv run uvicorn app.main:create_app --factory > api.log 2>&1 &
          env -u DATABASE_URL -u RABBITMQ_URL uv run python -m app.consumer > consumer.log 2>&1 &
          for _ in $(seq 1 60); do curl -fsS localhost:8000/health/ready -H "X-API-Key: change-me" && break; sleep 1; done
          id=$(curl -fsS -X POST localhost:8000/api/v1/payments -H "X-API-Key: change-me" -H "Idempotency-Key: demo-1" \
            -H "Content-Type: application/json" \
            -d '{"amount": "100.00", "currency": "RUB", "description": "demo", "webhook_url": "https://example.com/"}' | jq -r .payment_id)
          for _ in $(seq 1 30); do
            status=$(curl -fsS "localhost:8000/api/v1/payments/$id" -H "X-API-Key: change-me" | jq -r .status)
            [ "$status" != pending ] && break
            sleep 1
          done
          echo "payment $id: $status"
          cat api.log consumer.log | tail -20
          [ "$status" = succeeded ] || [ "$status" = failed ]
          pkill -f uvicorn
          pkill -f app.consumer
      - run: bash scripts/verify.sh
