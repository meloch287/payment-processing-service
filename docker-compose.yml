name: payments

x-app: &app
  build: .
  image: payment-processing-service:latest
  init: true
  restart: unless-stopped
  environment: &app-env
    API_KEY: ${API_KEY:?set API_KEY in .env}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-payments}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
    POSTGRES_DB: ${POSTGRES_DB:-payments}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:-payments}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-payments}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    OUTBOX_RELAY_ENABLED: ${OUTBOX_RELAY_ENABLED:-true}
    OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-0.5}
    OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
    OUTBOX_RETENTION_HOURS: ${OUTBOX_RETENTION_HOURS:-72}
    OUTBOX_CLEANUP_INTERVAL: ${OUTBOX_CLEANUP_INTERVAL:-300}
    PROCESSING_LEASE: ${PROCESSING_LEASE:-30}
    CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-16}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2}
    GATEWAY_MIN_DELAY: ${GATEWAY_MIN_DELAY:-2}
    GATEWAY_MAX_DELAY: ${GATEWAY_MAX_DELAY:-5}
    GATEWAY_SUCCESS_RATE: ${GATEWAY_SUCCESS_RATE:-0.9}
    WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-5}
    PUBLISH_TIMEOUT: ${PUBLISH_TIMEOUT:-10}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 10s
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-payments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-payments}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'X-API-Key': os.environ['API_KEY']}), timeout=3)"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20

  consumer:
    <<: *app
    command: ["python", "-m", "app.consumer"]
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 40s

volumes:
  postgres-data:
  rabbitmq-data:
